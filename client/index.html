<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wonkle</title>
  
<style>
    @font-face {
      font-family: 'Coral Pixels';
      src: url('/fonts/Coral_Pixels/CoralPixels-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Libre Barcode 39 Text';
      src: url('/fonts/Libre_Barcode_39_Text/LibreBarcode39Text-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Noto Serif';
      src: url('/fonts/Noto_Serif/NotoSerif-VariableFont_wdth,wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Noto Serif';
      src: url('/fonts/Noto_Serif/NotoSerif-Italic-VariableFont_wdth,wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Serif', Georgia, serif;
      background: #dffcde;
      color: #000;
      line-height: 1.5;
      max-width: 40rem;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    h1 {
      font-family: 'Coral Pixels', sans-serif;
      font-size: clamp(2.2rem, 9vw, 3.4rem);
      text-align: center;
      letter-spacing: 0.04em;
      margin: 0.75rem 0 0.25rem;
    }
    #player, #participants {
      font-family: 'Coral Pixels', sans-serif;
      font-size: 0.85rem;
      text-align: center;
      margin: 0.2rem 0;
    }
    blockquote {
      white-space: pre-wrap;
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border: 2px solid #000;
      border-radius: 6px;
      background: #000;
      color: #dffcde;
    }
    button {
      font: inherit;
      font-weight: bold;
      margin: 0.25rem;
      padding: 0.5rem 0.9rem;
      color: #000;
      background: #c1f2bf;
      border: 2px solid #000;
      border-radius: 4px;
      box-shadow: 2px 2px 0 #000;
      cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { box-shadow: none; transform: translate(2px, 2px); }
    button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    button.selected { background: #000; color: #fff; }
    .options { display: flex; flex-wrap: wrap; justify-content: center; margin: 1.25rem 0 1.75rem; }
    .lockrow { display: flex; justify-content: flex-end; }
    .hintbtn { margin-right: auto; }
    .msg.ctx { opacity: 0.5; font-size: 0.9em; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
    #app .thumbs img {
      width: auto;
      max-width: 140px;
      max-height: 110px;
      margin: 0;
      border: 1px solid #dffcde;
      border-radius: 4px;
    }
    .lock { background: #000; color: #fff; }
    .jump {
      background: none;
      border: none;
      margin: 0;
      padding: 0;
      color: #2f7a2a;
      text-decoration: underline;
      cursor: pointer;
      font-weight: normal;
      box-shadow: none;
    }
    .jump:hover { color: #000; }
    #app img {
      display: block;
      width: min(400px, 90%);
      height: auto;
      margin: 1.5rem auto;
      border: 3px solid #000;
      border-radius: 14px;
    }
    #app p {text-align: center; margin: 1rem 0; }
    #app .pfp {
      display: inline-block;
      width: 1.5em;
      height: 1.5em;
      margin: 0 0.4em 0 0;
      border: 1px solid #000;
      border-radius: 50%;
      vertical-align: -0.4em;
    }
    #app .emoji {
      display: inline-block;
      width: 1.4em;
      height: 1.4em;
      margin: 0;
      border: none;
      border-radius: 0;
      vertical-align: -0.35em;
    }
    .msg { display: flex; align-items: flex-start; gap: 0.6rem; margin: 1rem 0; }
    .msg[hidden] { display: none; }
    .who {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.3rem;
      overflow: hidden;
      background: #000;
      border: 2px solid #000;
      border-radius: 50%;
    }
    #app .who img { display: block; width: 100%; height: 100%; margin: 0; border: none; border-radius: 50%; }
    .body {
      flex: 1;
      min-width: 0;
      padding: 0.6rem 1rem 0.75rem;
      background: #000;
      color: #dffcde;
      border: 2px solid #000;
      border-radius: 6px;
    }
    .head { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.15rem; }
    .name { font-weight: bold; color: #fff; }
    .name.good { color: #6aaa64; }
    .name.bad { color: #e06666; font-weight: normal; text-decoration: line-through; opacity: 0.6; }
    .stamp { font-size: 0.7rem; color: #7f9a7f; }
    .jumprow { display: flex; justify-content: flex-end; margin-top: 0.35rem; }
    .body blockquote { margin: 0; padding: 0; border: none; border-radius: 0; background: none; color: inherit; }
    .others { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin: 1rem 0 1.5rem; }
    #app .others img { width: 200px; margin: 0; border-width: 2px; border-radius: 8px; }
    footer { font-family: 'Coral Pixels', sans-serif; text-align: center; font-size: 0.7rem; color: #5a6e5a; margin-top: 2.5rem; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    #mini { display: none; }
    body.minimized > *:not(#mini) { display: none; }
    body.minimized #mini {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      text-align: center;
    }
    #mini .cat { font-size: clamp(3rem, 30vmin, 7rem); }
    #mini p {
      font-family: Impact, 'Arial Black', sans-serif;
      text-transform: uppercase;
      color: #000;
      margin: 0.5rem 1rem 0;
    }
  </style>
</head>
<body>
  <h1>Wonkle</h1>
  <p id="player"></p>
  <p id="participants"></p>
  <div id="app"><p>Connecting…</p></div>
  <footer>wonkacord.<span class="blink">▮</span></footer>
  <div id="mini">
    <div class="cat">🐱</div>
    <p>wonkle is minimized!</p>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
